<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Barbie Village">
  <title>Barbie Village</title>
  <!-- Marcador tipográfico/simbólico até o PNG oficial da equipe entrar em
       logo-equipe.png. Em 32px o mascote seria ilegível de qualquer forma:
       o que se reconhece nesse tamanho é a silhueta das asas. -->
  <rect width="64" height="64" rx="14" fill="#111111" />
  <g transform="translate(32 33)">
    <!-- asas -->
    <path d="M-3 2C-11 -14 -25 -18 -27 -8c-2 10 8 19 21 16Z" fill="#E31C79" />
    <path d="M3 2C11 -14 25 -18 27 -8c2 10-8 19-21 16Z" fill="#E31C79" />
    <path d="M-3 3C-9 -8 -18 -11 -19.5 -5c-1.4 6 5 11 14 9Z" fill="#F286B7" />
    <path d="M3 3C9 -8 18 -11 19.5 -5c1.4 6-5 11-14 9Z" fill="#F286B7" />
    <!-- antenas -->
    <path d="M-2 -9c-3-5-7-7-9-11" stroke="#F286B7" stroke-width="2.6" stroke-linecap="round" fill="none" />
    <path d="M2 -9c3-5 7-7 9-11" stroke="#F286B7" stroke-width="2.6" stroke-linecap="round" fill="none" />
    <!-- corpo -->
    <ellipse cx="0" cy="-2" rx="4.6" ry="10.5" fill="#E31C79" />
    <ellipse cx="0" cy="-7.5" rx="3.4" ry="3.4" fill="#F286B7" />
  </g>
</svg>
